name: claude-fixedwindow
# Claude chat seat: fixed-window prime inequality as a no-blowup test (zeta, chi5, Davenport-Heilbronn).
on:
  workflow_dispatch:
  push:
    paths: ['discovery/fixed_window/fixed_window.py', '.github/workflows/claude-fixedwindow.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy numba mpmath
      - working-directory: discovery/fixed_window
        run: python fixed_window.py 2e7
      - if: always()
        run: |
          git config user.name "gpp-bot"
          git config user.email "dtoupin@goldenphysics.org"
          git add discovery/fixed_window/results
          git commit -m "fixed_window: results $(date -u +%FT%TZ)" || echo "no change"
          git pull --rebase origin main && git push
