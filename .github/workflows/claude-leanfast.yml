name: claude-leanfast

# Fast lane for Lean in the discovery workbench, mirroring GPPVerify's heart-fast.yml: compile only the
# Lean files that changed (or the ones named at dispatch), against the pinned, cached Mathlib, and
# report. It is an ITERATION aid: it records nothing in the repo (no commit-back, unlike
# claude-leanbridge / claude-leansweep) and proves nothing by itself. Anything that hardens is
# promoted to GPPVerify through its own gates. Files are checked with `lake env lean` inside
# lean_sweep/, which owns the lakefile and the Mathlib pin (v4.33.1).

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'space-separated .lean paths relative to the repo root (empty = every .lean under lean_sweep/ except the Sweep root)'
        required: false
        default: ''
  push:
    paths: ['lean_sweep/**.lean', 'discovery/**.lean', '.github/workflows/claude-leanfast.yml']

permissions:
  contents: read

jobs:
  fast:
    name: fast lean
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick files
        id: pick
        env:
          INPUT_FILES: ${{ github.event.inputs.files }}
        run: |
          if [ -n "$INPUT_FILES" ]; then
            printf '%s\n' $INPUT_FILES > files.txt
          elif [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only HEAD~1 HEAD -- '*.lean' > files.txt || true
          else
            find lean_sweep -name '*.lean' -not -path '*/.lake/*' -not -name 'Sweep.lean' | sort > files.txt
          fi
          echo "files:"; cat files.txt
          echo "count=$(grep -c . files.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Install elan
        if: steps.pick.outputs.count != '0'
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 \
            https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain
        if: steps.pick.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean_sweep/lean-toolchain') }}

      - name: Cache lake packages
        if: steps.pick.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: lean_sweep/.lake
          key: sweep-lake-${{ hashFiles('lean_sweep/lake-manifest.json', 'lean_sweep/lean-toolchain') }}

      - name: Mathlib cache
        if: steps.pick.outputs.count != '0'
        working-directory: lean_sweep
        run: lake exe cache get

      - name: Compile
        if: steps.pick.outputs.count != '0'
        run: |
          fail=0
          echo "| file | result | seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || { echo "skip (missing): $f"; continue; }
            start=$(date +%s)
            if (cd lean_sweep && lake env lean "../$f") > out.txt 2>&1; then rc=ok; else rc=FAIL; fail=1; fi
            end=$(date +%s)
            echo "=== $f: $rc"; cat out.txt
            echo "| \`$f\` | $rc | $((end-start)) |" >> "$GITHUB_STEP_SUMMARY"
            grep -n "sorry" "$f" >/dev/null 2>&1 && echo "| \`$f\` | contains sorry | |" >> "$GITHUB_STEP_SUMMARY"
          done < files.txt
          exit $fail
