name: claude-leansweep
# Claude chat seat: tactic sweep over the RH-map bridging lemmas (gpp-bridge CLAUDE_RH_MAP.md section 5).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'space-separated target names (empty = all)'
        required: false
        default: ''
  push:
    paths: ['lean_sweep/targets.py', 'lean_sweep/sweep.py', '.github/workflows/claude-leansweep.yml']
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: lean_sweep
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean_sweep/lean-toolchain') }}
      - uses: actions/cache@v4
        with:
          path: lean_sweep/.lake
          key: sweep-lake-${{ hashFiles('lean_sweep/lake-manifest.json', 'lean_sweep/lean-toolchain') }}
      - name: Mathlib cache
        run: lake exe cache get
      - name: Sweep
        run: python3 sweep.py ${{ github.event.inputs.targets }}
      - if: always()
        working-directory: .
        run: |
          git config user.name "gpp-bot"
          git config user.email "dtoupin@goldenphysics.org"
          git add lean_sweep/results
          git commit -m "lean_sweep: results $(date -u +%FT%TZ)" || echo "no change"
          git pull --rebase origin main && git push
