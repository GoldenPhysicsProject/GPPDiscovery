name: weil-decay-scan
on:
  workflow_dispatch:
  push:
    paths: ['point.py', 'fit.py', '.github/workflows/scan.yml']
permissions:
  contents: write
jobs:
  point:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {c: 7,  N: 20}
          - {c: 7,  N: 28}
          - {c: 7,  N: 36}
          - {c: 3,  N: 36}
          - {c: 5,  N: 36}
          - {c: 11, N: 36}
          - {c: 13, N: 36}
          - {c: 17, N: 36}
          - {c: 19, N: 36}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python point.py --c ${{ matrix.c }} --N ${{ matrix.N }} --T 300 --dps 90
      - uses: actions/upload-artifact@v4
        with:
          name: pt-c${{ matrix.c }}-N${{ matrix.N }}
          path: result.json
  collect:
    needs: point
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - run: python fit.py
      - run: |
          git config user.name "gpp-bot"
          git config user.email "dtoupin@goldenphysics.org"
          git add results.jsonl RESULTS.md
          git commit -m "scan results $(date -u +%FT%TZ)" || echo "no change"
          git push
